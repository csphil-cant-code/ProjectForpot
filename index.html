<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9f5ec" />
    <meta
      name="description"
      content="Pondo — Budget ni Pot for your GCash and cash."
    />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Pondo · Budget ni Pot</title>
  </head>
  <body>
    <div
      id="app-loader"
      class="app-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading Pondo"
    >
      <div class="app-loader__inner">
        <div class="app-loader__mark-wrap" aria-hidden="true">
          <img
            class="app-loader__mark"
            src="/logo-mark-light.jpg"
            alt=""
            width="76"
            height="76"
            draggable="false"
          />
          <span class="app-loader__ring"></span>
        </div>

        <div class="app-loader__wordmark">
          <span class="app-loader__name">Pondo</span>
          <span class="app-loader__tagline">Budget ni Pot</span>
        </div>

        <div class="app-loader__bar" aria-hidden="true"><span></span></div>
        <p class="app-loader__status">Loading your budget…</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
